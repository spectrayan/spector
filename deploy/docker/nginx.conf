# ═══════════════════════════════════════════════════════════════════
# Spector OSS — Nginx Reverse Proxy + SPA (Non-Root UID 1000)
# ═══════════════════════════════════════════════════════════════════
# Serves Angular Cortex dashboard and proxies API/MCP to backend.
#
# Backend runs on port 7070. Nginx exposes port 8080.
# ═══════════════════════════════════════════════════════════════════

pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    access_log /var/log/nginx/access.log;

    upstream synapse_backend {
        server 127.0.0.1:7070;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # ── Gzip Compression ─────────────────────────────────────────
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;

        # ── Static Files (Angular SPA) ───────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets aggressively (hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── ALL API Endpoints → Synapse Backend (7070) ───────────────
        location /api/ {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "keep-alive";

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── SSE Event Stream → Synapse Backend (NO buffering) ────────
        location /sse/ {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # Critical for SSE: disable all buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
            gzip off;
        }

        # Legacy SSE path /api/v1/events
        location /api/v1/events {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
            gzip off;
        }

        # ── MCP Streamable HTTP → Synapse Backend ────────────────────
        location /mcp {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # MCP responses can be SSE streams — disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding off;
            gzip off;
        }

        # ── Health Checks → Synapse Backend ──────────────────────────
        location /actuator/health {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /health {
            proxy_pass http://synapse_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ── index.html — never cache (ensures fresh bundles after deploy) ──
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        # ── Angular SPA Fallback ─────────────────────────────────────
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
