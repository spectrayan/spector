{{- if .Values.networkPolicy.enabled }}
# 1. Default-deny all ingress traffic in the cell namespace (Invariant: Deny before allow)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spector.fullname" . }}-default-deny
  labels:
    {{- include "spector.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Allow API port 7070 ingress to owners and replicas strictly from the gateway tier (Req R5.1)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spector.fullname" . }}-allow-gateway-ingress
  labels:
    {{- include "spector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - owner
          - replica
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "spector.name" . }}
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 7070
---
# 3. Allow replication port 9090 ingress strictly from owner pods to replica pods (Req R5.2, Invariant T4)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spector.fullname" . }}-allow-replication
  labels:
    {{- include "spector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "spector.name" . }}
      app.kubernetes.io/component: replica
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "spector.name" . }}
              app.kubernetes.io/component: owner
      ports:
        - protocol: TCP
          port: 9090
---
# 4. Restrict Redis port 6379 access strictly to gateway and owner nodes (Req R5.4)
{{- if .Values.networkPolicy.restrictRedis }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spector.fullname" . }}-allow-redis
  labels:
    {{- include "spector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - owner
                  - gateway
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}
