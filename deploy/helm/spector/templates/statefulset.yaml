apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "spector.fullname" . }}
  labels:
    {{- include "spector.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "spector.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "spector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spector.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spector.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- if and .Values.sysctl.enabled (not .Values.sysctl.useInitContainer) }}
        sysctls:
          - name: vm.max_map_count
            value: {{ .Values.sysctl.vmMaxMapCount | quote }}
          - name: fs.file-max
            value: {{ .Values.sysctl.fsFileMax | quote }}
        {{- end }}
      {{- if and .Values.sysctl.enabled .Values.sysctl.useInitContainer }}
      initContainers:
        - name: init-sysctl
          image: "{{ .Values.sysctl.image.repository }}:{{ .Values.sysctl.image.tag }}"
          imagePullPolicy: {{ .Values.sysctl.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w vm.max_map_count={{ .Values.sysctl.vmMaxMapCount | int }}
              sysctl -w fs.file-max={{ .Values.sysctl.fsFileMax | int }}
          securityContext:
            privileged: true
            runAsUser: 0
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: dashboard
              containerPort: 8080
              protocol: TCP
            - name: api
              containerPort: 7070
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.secretRef.name }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef.name }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config
              mountPath: /app/spector.yml
              subPath: spector.yml
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 7070
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 7070
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 7070
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "spector.fullname" . }}-config
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "spector.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- if .Values.persistence.createStorageClass }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- else if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
