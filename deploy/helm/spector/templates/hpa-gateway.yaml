{{- if and (ne (default "split" .Values.topology.mode) "single-role") .Values.gateway.enabled .Values.gateway.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "spector.gateway.fullname" . }}-hpa
  labels:
    {{- include "spector.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "spector.gateway.fullname" . }}
  minReplicas: {{ .Values.gateway.hpa.minReplicas | default 2 }}
  maxReplicas: {{ .Values.gateway.hpa.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.hpa.targetCPUUtilizationPercentage | default 80 }}
{{- end }}
