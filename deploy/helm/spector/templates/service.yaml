apiVersion: v1
kind: Service
metadata:
  name: {{ include "spector.fullname" . }}
  labels:
    {{- include "spector.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.dashboard }}
      targetPort: 80
      protocol: TCP
      name: dashboard
    - port: {{ .Values.service.ports.api }}
      targetPort: 7070
      protocol: TCP
      name: api
  selector:
    {{- include "spector.selectorLabels" . | nindent 4 }}
