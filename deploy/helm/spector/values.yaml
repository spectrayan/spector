# Default values for spector.
# Developer-friendly defaults suitable for local clusters (kind, k3d, Minikube) and cloud clusters.

replicaCount: 1

image:
  repository: ghcr.io/spectrayan/spector
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  ports:
    dashboard: 7700
    api: 7070

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spector.local
      paths:
        - path: /
          pathType: Prefix
          port: 7700
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 3Gi
  requests:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /data
  # storageClass: "-"

env:
  SPECTOR_PORT: "7070"
  SPECTOR_NODE_ID: "spector-k8s"
  SPECTOR_DATA_DIR: "/data"
  # ── Embedding Provider ──
  SPECTOR_EMBEDDING_PROVIDER: "ollama"
  SPECTOR_EMBEDDING_MODEL: "nomic-embed-text"
  SPECTOR_EMBEDDING_BASE_URL: ""
  SPECTOR_EMBEDDING_DIMS: "768"
  # ── Generation (LLM) Provider ──
  SPECTOR_GENERATION_PROVIDER: "ollama"
  SPECTOR_GENERATION_MODEL: "llama3.2"
  SPECTOR_GENERATION_BASE_URL: ""
  # ── Memory ──
  SPECTOR_MEMORY_CAPACITY: "10000"
  SPECTOR_ENTITY_EXTRACTION_MODE: "NONE"
  SPECTOR_TAG_EXTRACTOR: "content"
  SPECTOR_TEXT_SEARCH_MODE: "HYBRID"

# API keys — use Kubernetes Secrets (not plain env vars)
secretRef:
  # Name of an existing Kubernetes Secret containing API keys.
  # Expected keys: SPECTOR_EMBEDDING_API_KEY, SPECTOR_GENERATION_API_KEY, SPECTOR_API_KEY
  name: ""

config:
  persistence:
    path: /data/memory
    wal:
      path: /data/memory/wal
  index:
    path: /data/index

nodeSelector: {}
tolerations: []
affinity: {}
