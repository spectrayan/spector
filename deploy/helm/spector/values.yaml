# Default values for spector.
# Developer-friendly defaults suitable for local clusters (kind, k3d, Minikube) and cloud clusters.

# ── Cell Identity & Topology ──
cell:
  id: "cell-1"
  region: "us-east-1"

topology:
  # Mode: "split" (distinct owner, replica, and gateway sets) or "single-role" (legacy single statefulset)
  mode: "split"

# Global replica count (used in single-role mode)
replicaCount: 1

image:
  repository: ghcr.io/spectrayan/spector
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ── Kernel & OS Tuning (Project Panama FFM off-heap mmap & file descriptor limits) ──
sysctl:
  enabled: true
  useInitContainer: true
  vmMaxMapCount: 262144
  vmSwappiness: 1
  fsFileMax: 1048576
  limits:
    nofile: 262144
    memlock: "unlimited"
  image:
    repository: busybox
    tag: "1.37"
    pullPolicy: IfNotPresent

# ── Role Split Configurations ──

# Owners: Authoritative single writers holding live namespaces and local NVMe storage.
owners:
  enabled: true
  replicas: 3
  resources:
    # requests.memory == limits.memory is strictly enforced (Invariant T3) to protect OS page cache under cgroups v2
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
  jvmOpts: "-Xms2G -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+UnlockDiagnosticVMOptions -XX:+UnlockExperimentalVMOptions --add-modules=jdk.incubator.vector --enable-preview --enable-native-access=ALL-UNNAMED -Djava.lang.foreign.restricted=permit"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - owner
          topologyKey: "kubernetes.io/hostname"
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClass: "spector-nvme-local"
  pdb:
    enabled: true
    maxUnavailable: 1

# Replicas: Asynchronous read/standby followers subscribing to snapshots and WAL streams.
replicas:
  enabled: true
  replicas: 2
  hotCap: 500
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  jvmOpts: "-Xms2G -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+UnlockDiagnosticVMOptions -XX:+UnlockExperimentalVMOptions --add-modules=jdk.incubator.vector --enable-preview --enable-native-access=ALL-UNNAMED -Djava.lang.foreign.restricted=permit"
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClass: "spector-nvme-local"

# Gateway: Stateless API proxy evaluating routing waterfall and forwarding client requests.
gateway:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# ── Routing & Coordination ──
routing:
  redis:
    enabled: true
    url: "redis://spector-redis:6379"
    inChart:
      enabled: false

coordinator:
  leaseDurationSeconds: 15
  renewIntervalSeconds: 10

# ── Pager Capacities ──
pager:
  hotCap: 2000
  warmCap: 20000

# ── Cold Tier Storage ──
coldTier:
  enabled: false
  provider: "s3"
  bucket: ""

# ── Disaster Recovery (Phase 6 inert pre-declarations per Req R7.8) ──
dr:
  bucket: ""
  exportInterval: "15m"

# ── Network Boundaries & Security ──
networkPolicy:
  enabled: true
  ingressFromGatewayOnly: true
  restrictReplication: true
  restrictRedis: true

# ── Observability ──
serviceMonitor:
  enabled: true
  interval: "15s"

service:
  type: ClusterIP
  ports:
    dashboard: 7700
    api: 7070
    replication: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spector.local
      paths:
        - path: /
          pathType: Prefix
          port: 7700
  tls: []

# Baseline storage parameters (used in single-role mode)
resources:
  limits:
    cpu: 2000m
    memory: 3Gi
  requests:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 100Gi
  mountPath: /data
  storageClass: "spector-nvme-local"

  createStorageClass: false
  storageClassName: "spector-high-perf"
  provisioner: "ebs.csi.aws.com"
  volumeBindingMode: "WaitForFirstConsumer"
  allowVolumeExpansion: true
  parameters:
    type: gp3
    iops: "3000"
    throughput: "125"
    encrypted: "true"

env:
  SPECTOR_PORT: "7070"
  SPECTOR_DATA_DIR: "/data"
  # ── Embedding Provider ──
  SPECTOR_EMBEDDING_PROVIDER: "ollama"
  SPECTOR_EMBEDDING_MODEL: "nomic-embed-text"
  SPECTOR_EMBEDDING_BASE_URL: ""
  SPECTOR_EMBEDDING_DIMS: "768"
  # ── Generation (LLM) Provider ──
  SPECTOR_GENERATION_PROVIDER: "ollama"
  SPECTOR_GENERATION_MODEL: "llama3.2"
  SPECTOR_GENERATION_BASE_URL: ""
  # ── Memory ──
  SPECTOR_MEMORY_CAPACITY: "10000"
  SPECTOR_ENTITY_EXTRACTION_MODE: "NONE"
  SPECTOR_TAG_EXTRACTOR: "content"
  SPECTOR_TEXT_SEARCH_MODE: "HYBRID"

# API keys — use Kubernetes Secrets (not plain env vars)
secretRef:
  name: ""

config:
  persistence:
    path: /data/memory
    wal:
      path: /data/memory/wal
  index:
    path: /data/index

nodeSelector: {}
tolerations: []
affinity: {}
