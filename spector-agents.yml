# Spector config for the AI team's shared cognitive memory (MCP server).
# Memory-first: cognitive memory tools enabled with disk persistence.
spector:
  mode: MEMORY
  provider:
    embedding:
      model: nomic-embed-text
      base-url: http://localhost:11434
      dimensions: 768
  memory:
    enabled: true                  # registers the memory_* tools
    dimensions: 768
    capacity: 100000
    persistence-mode: DISK
    persistence-path: .spector/memory
    nodes-per-partition: 10000
