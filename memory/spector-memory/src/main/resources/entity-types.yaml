version: 1
strictness: LOG
entity_types:
  PERSON:
    aliases: [HUMAN, USER, INDIVIDUAL, DEVELOPER, ENGINEER, RESEARCHER, SCIENTIST, ARCHITECT, DESIGNER]
  ORGANIZATION:
    aliases: [ORGANISATION, COMPANY, CORP, CORPORATION, ENTERPRISE, FIRM, STARTUP, INSTITUTE, VENDOR]
  TEAM:
    parent: ORGANIZATION
    aliases: [SQUAD, GROUP, DEPARTMENT, DIVISION, UNIT, GUILD]
  ROLE:
    aliases: [JOB_TITLE, POSITION, OCCUPATION, RESPONSIBILITY]
  PROJECT:
    aliases: [REPO, REPOSITORY, CODEBASE, MODULE, REPO_BRANCH, WORKSPACE]
  PRODUCT:
    aliases: [SERVICE_PRODUCT, OFFERING, SAAS, APPLICATION, PLATFORM]
  TASK:
    aliases: [TICKET, ISSUE, BUG, ACTION_ITEM, TODO, EPIC, STORY]
  CONCEPT:
    aliases: [IDEA, PRINCIPLE, PATTERN, PARADIGM, THEORY, APPROACH, METHODOLOGY, STRATEGY]
  TOPIC:
    parent: CONCEPT
    aliases: [SUBJECT, DOMAIN, THEME, FIELD]
  SKILL:
    parent: CONCEPT
    aliases: [CAPABILITY, EXPERTISE, COMPETENCE, PROFICIENCY]
  DECISION:
    parent: CONCEPT
    aliases: [ADR, ARCHITECTURAL_DECISION, CHOICE, RESOLUTION, POLICY]
  TECHNOLOGY:
    aliases: [TECH, FRAMEWORK, LIBRARY, SDK, PACKAGE, DEPENDENCY, RUNTIME, ENGINE]
  PROGRAMMING_LANGUAGE:
    parent: TECHNOLOGY
    aliases: [LANGUAGE, LANG, PL]
  API:
    parent: TECHNOLOGY
    aliases: [INTERFACE, ENDPOINT, REST_API, GRPC_SERVICE, GRAPHQL_SCHEMA]
  TOOL:
    parent: TECHNOLOGY
    aliases: [UTILITY, CLI, APP, LINTER, PROFILER, COMPILER]
  DATABASE:
    parent: TECHNOLOGY
    aliases: [DATASTORE, DB, RDBMS, NOSQL, CACHE, VECTOR_DB]
  SERVICE:
    parent: PRODUCT
    aliases: [MICROSERVICE, BACKEND, DAEMON, SERVER, WORKER]
  ARTIFACT:
    aliases: [DOCUMENT, FILE, REPORT, SPEC, DESIGN, RECORD, LOG_ENTRY, BINARY, JAR]
  EVENT:
    aliases: [MEETING, CONFERENCE, MILESTONE, INCIDENT, OCCURRENCE, OUTAGE, RELEASE, DEPLOYMENT]
  LOCATION:
    aliases: [PLACE, CITY, COUNTRY, REGION, ADDRESS, VENUE, CLOUD_REGION, DATA_CENTER]
  DATE_TIME:
    aliases: [DATE, TIME, PERIOD, DURATION, TIMESTAMP, SCHEDULE]
  PROCESS:
    aliases: [WORKFLOW, PIPELINE, PROCEDURE, PROTOCOL, CI_CD]
  METRIC:
    aliases: [MEASUREMENT, KPI, SCORE, STATISTIC, BENCHMARK, LATENCY, THROUGHPUT]
  OTHER:
