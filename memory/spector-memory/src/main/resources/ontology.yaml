relationship_predicates:
  USES:
    inverse: USED_BY
  PART_OF:
    inverse: CONTAINS
    children: [MEMBER_OF]
  MEMBER_OF:
    parent: PART_OF
    inverse: HAS_MEMBER
    aliases: [EMPLOYED_AT, WORKS_AT]
  DEVELOPED_BY:
    inverse: DEVELOPED
    aliases: [BUILT_BY, AUTHORED_BY]
  WORKS_ON:
    inverse: WORKED_ON_BY
  MANAGES:
    inverse: MANAGED_BY
    children: [REPORTS_TO]
    aliases: [OWNED_BY]
  REPORTS_TO:
    parent: MANAGES
    inverse: SUPERVISES
  RELATED_TO:
    inverse: RELATED_TO
  DEPENDS_ON:
    inverse: DEPENDED_ON_BY
  RUNS_ON:
    inverse: HOSTS
  CREATED_BY:
    inverse: CREATED
  LOCATED_IN:
    inverse: LOCATION_OF
    aliases: [BASED_IN, LIVES_IN]
  COLLABORATES_WITH:
    inverse: COLLABORATES_WITH
  IMPLEMENTS:
    inverse: IMPLEMENTED_BY
  PRECEDES:
    inverse: FOLLOWS
  FOLLOWS:
    inverse: PRECEDES
