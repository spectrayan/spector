version: 1
strictness: LOG
relationship_predicates:
  # ── Causality & Incident Analysis (ADR-0010, #273) ──
  CAUSES:
    inverse: CAUSED_BY
    children: [LED_TO, TRIGGERED]
    aliases: [INDUCES, RESULTS_IN, PRODUCES, GENERATES]
  CAUSED_BY:
    inverse: CAUSES
    aliases: [TRIGGERED_BY, RESULTED_FROM, DUE_TO, CAUSED, INDUCED_BY]
  LED_TO:
    parent: CAUSES
    inverse: RESULTED_FROM
    aliases: [LEAD_TO, LEDS_TO]
  RESULTED_FROM:
    inverse: LED_TO
    aliases: [AROSE_FROM, CONSEQUENCE_OF]
  TRIGGERED:
    parent: CAUSES
    inverse: TRIGGERED_BY
    aliases: [ACTIVATED, INITIATED, SPARKED]
  TRIGGERED_BY:
    inverse: TRIGGERED
    aliases: [INITIATED_BY, ACTIVATED_BY]
  PREVENTED:
    inverse: PREVENTED_BY
    aliases: [BLOCKED, STOPPED, MITIGATED, AVOIDED, AVERTED]
  PREVENTED_BY:
    inverse: PREVENTED
    aliases: [BLOCKED_BY, MITIGATED_BY]
  CORRELATED_WITH:
    inverse: CORRELATED_WITH
    aliases: [CO_OCCURS_WITH, ASSOCIATED_WITH, COINCIDES_WITH]
  ROOT_CAUSE_OF:
    inverse: ROOT_CAUSE_IS
    aliases: [UNDERLYING_CAUSE_OF, PRIMARY_CAUSE_OF]
  ROOT_CAUSE_IS:
    inverse: ROOT_CAUSE_OF
    aliases: [UNDERLYING_CAUSE_IS, TRACED_TO]

  # ── People & Ownership ──
  MANAGES:
    inverse: MANAGED_BY
    children: [REPORTS_TO]
    aliases: [LEADS, DIRECTS, HEADS]
  MANAGED_BY:
    inverse: MANAGES
    aliases: [LED_BY, DIRECTED_BY]
  REPORTS_TO:
    parent: MANAGES
    inverse: SUPERVISES
  SUPERVISES:
    inverse: REPORTS_TO
  OWNS:
    inverse: OWNED_BY
    aliases: [MAINTAINS, POSSESSES]
  OWNED_BY:
    inverse: OWNS
    aliases: [MAINTAINED_BY]
  WORKS_ON:
    inverse: WORKED_ON_BY
    aliases: [CONTRIBUTES_TO, DEVELOPS]
  WORKED_ON_BY:
    inverse: WORKS_ON
    aliases: [CONTRIBUTED_BY]
  DEVELOPED_BY:
    inverse: DEVELOPED
    aliases: [BUILT_BY, AUTHORED_BY, WRITTEN_BY, CODED_BY]
  DEVELOPED:
    inverse: DEVELOPED_BY
    aliases: [BUILT, AUTHORED, WROTE]
  CREATED_BY:
    inverse: CREATED
    aliases: [GENERATED_BY, DESIGNED_BY]
  CREATED:
    inverse: CREATED_BY
    aliases: [GENERATED, DESIGNED]
  COLLABORATES_WITH:
    inverse: COLLABORATES_WITH
    aliases: [WORKS_WITH, PARTNERS_WITH]

  # ── Structural & Dependencies ──
  PART_OF:
    inverse: CONTAINS
    children: [MEMBER_OF]
    aliases: [SUBCOMPONENT_OF, BELONGS_TO]
  CONTAINS:
    inverse: PART_OF
    aliases: [INCLUDES, COMPRISES, HAS_PART]
  MEMBER_OF:
    parent: PART_OF
    inverse: HAS_MEMBER
    aliases: [EMPLOYED_AT, WORKS_AT, AFFILIATED_WITH]
  HAS_MEMBER:
    inverse: MEMBER_OF
    aliases: [EMPLOYS, HAS_EMPLOYEE]
  DEPENDS_ON:
    inverse: DEPENDED_ON_BY
    aliases: [REQUIRES, RELIES_ON, NEEDS]
  DEPENDED_ON_BY:
    inverse: DEPENDED_ON_BY
    aliases: [REQUIRED_BY]
  USES:
    inverse: USED_BY
    aliases: [UTILIZES, CONSUMES, CALLS]
  USED_BY:
    inverse: USES
    aliases: [UTILIZED_BY, CONSUMED_BY, CALLED_BY]
  IMPLEMENTS:
    inverse: IMPLEMENTED_BY
    aliases: [REALIZES, FULFILLS]
  IMPLEMENTED_BY:
    inverse: IMPLEMENTED
    aliases: [REALIZED_BY]
  RUNS_ON:
    inverse: HOSTS
    aliases: [EXECUTED_ON, DEPLOYED_TO]
  HOSTS:
    inverse: RUNS_ON
    aliases: [EXECUTES, HOSTING]
  LOCATED_IN:
    inverse: LOCATION_OF
    aliases: [BASED_IN, LIVES_IN, SITUATED_AT]
  LOCATION_OF:
    inverse: LOCATED_IN

  # ── Temporal Sequencing ──
  PRECEDES:
    inverse: FOLLOWS
    aliases: [BEFORE, PRIOR_TO, ANTECEDENT_OF]
  FOLLOWS:
    inverse: PRECEDES
    aliases: [AFTER, SUBSEQUENT_TO, SUCCEEDS]
  SUPERSEDES:
    inverse: SUPERSEDED_BY
    aliases: [REPLACES, DEPRECATES, OVERRIDES]
  SUPERSEDED_BY:
    inverse: SUPERSEDES
    aliases: [REPLACED_BY, DEPRECATED_BY]

  # ── Catch-All ──
  RELATED_TO:
    inverse: RELATED_TO
    aliases: [ASSOCIATED_TO, CONNECTED_TO]
  OTHER:
    inverse: OTHER
