[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spector-client"
version = "0.1.0a2"
description = "Client SDK for Spector — Cognitive memory engine for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Spectrayan Maintainers", email = "dev@spectrayan.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["spector", "spector-client", "ai-memory", "cognitive-memory", "ai-agents", "memory-engine", "mcp", "llm", "agentic-memory"]

# Zero mandatory dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
httpx = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/spectrayan/spector"
Documentation = "https://spectrayan.github.io/spector/"
Repository = "https://github.com/spectrayan/spector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
