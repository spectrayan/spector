openapi: 3.1.0
info:
  title: Spector Cognitive Memory & Search API
  description: "Ultra-fast cognitive memory, vector search, and agent orchestration\
    \ platform with biological memory tiers (Working, Episodic, Semantic, Procedural)."
  contact:
    name: Spectrayan Maintainers
    url: https://github.com/spectrayan/spector
    email: support@spectrayan.com
  license:
    name: "Apache License, Version 2.0"
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
- url: /
  description: Current Server Instance
security:
- ApiKeyAuth: []
- BearerAuth: []
tags:
- name: Memory
  description: "Cognitive Memory Operations (Remember, Recall, Search, Forget, Reinforce,\
    \ Inspect)"
