{% extends "base.html" %}

{% block extrahead %}
  <script>
    /* Early Shadow DOM Hook for Mermaid Interactive Zoom */
    (function() {
      if (window.__spectorShadowHooked) return;
      window.__spectorShadowHooked = true;
      var orig = Element.prototype.attachShadow;
      if (orig) {
        Element.prototype.attachShadow = function(init) {
          var root = orig.call(this, { mode: 'open' });
          this._spectorShadowRoot = root;
          return root;
        };
      }
    })();
  </script>
  <style id="spector-table-high-contrast">
    /* Table container & layout */
    .md-typeset table:not(.highlighttable),
    .md-typeset table:not([class]),
    .md-typeset__table table {
      display: table !important;
      width: 100% !important;
      max-width: 100% !important;
      border-collapse: collapse !important;
      border-spacing: 0 !important;
      margin: 1.25em 0 !important;
      font-size: 0.74rem !important;
      line-height: 1.45 !important;
      border: 1px solid #94a3b8 !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05) !important;
    }
    .md-typeset table:not(.highlighttable) thead {
      display: table-header-group !important;
    }
    .md-typeset table:not(.highlighttable) thead tr {
      background-color: #e2e8f0 !important;
      border-bottom: 2px solid #00b4d8 !important;
    }
    .md-typeset table:not(.highlighttable) th {
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
      font-weight: 700 !important;
      font-size: 0.70rem !important;
      letter-spacing: 0.04em !important;
      text-transform: uppercase !important;
      padding: 0.55em 0.75em !important;
      border: 1px solid #cbd5e1 !important;
      border-bottom: 2px solid #00b4d8 !important;
      text-align: left !important;
      vertical-align: middle !important;
    }
    .md-typeset table:not(.highlighttable) td {
      padding: 0.45em 0.75em !important;
      border: 1px solid #cbd5e1 !important;
      vertical-align: top !important;
      color: #1e293b !important;
      font-size: 0.74rem !important;
      font-weight: 400 !important;
    }
    .md-typeset table:not(.highlighttable) tbody tr:nth-child(even) td {
      background-color: #f8fafc !important;
    }
    .md-typeset table:not(.highlighttable) tbody tr:nth-child(odd) td {
      background-color: #ffffff !important;
    }
    .md-typeset table:not(.highlighttable) tbody tr:hover td {
      background-color: #f0f9ff !important;
    }
    .md-typeset table:not(.highlighttable) code {
      font-size: 0.70rem !important;
      padding: 0.1em 0.35em !important;
      border-radius: 4px !important;
      background-color: #f1f5f9 !important;
      border: 1px solid #cbd5e1 !important;
      word-break: break-word !important;
      color: #0369a1 !important;
    }
    /* Dark Mode (Slate) */
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable),
    [data-md-color-scheme="slate"] .md-typeset table:not([class]),
    [data-md-color-scheme="slate"] .md-typeset__table table {
      border: 1px solid #475569 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3) !important;
      background-color: transparent !important;
    }
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable) thead tr {
      background-color: #242d3d !important;
      border-bottom: 2px solid #00d2ff !important;
    }
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable) th {
      background-color: #242d3d !important;
      color: #38bdf8 !important;
      font-weight: 700 !important;
      font-size: 0.70rem !important;
      letter-spacing: 0.04em !important;
      text-transform: uppercase !important;
      padding: 0.55em 0.75em !important;
      border: 1px solid #334155 !important;
      border-bottom: 2px solid #00d2ff !important;
    }
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable) td {
      padding: 0.45em 0.75em !important;
      border: 1px solid #334155 !important;
      color: #e2e8f0 !important;
      font-size: 0.74rem !important;
      font-weight: 400 !important;
      background-color: transparent !important;
    }
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable) tbody tr:nth-child(even) td {
      background-color: rgba(255, 255, 255, 0.02) !important;
    }
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable) tbody tr:nth-child(odd) td {
      background-color: transparent !important;
    }
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable) tbody tr:hover td {
      background-color: rgba(56, 189, 248, 0.08) !important;
    }
    [data-md-color-scheme="slate"] .md-typeset table:not(.highlighttable) code {
      font-size: 0.70rem !important;
      padding: 0.1em 0.35em !important;
      background-color: #1e293b !important;
      border: 1px solid #475569 !important;
      color: #38bdf8 !important;
    }
  </style>
  {% if page and page.meta %}
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.canonical_url }}" />
  <meta property="og:title" content="{{ page.meta.get('title', page.title) }} — Spector" />
  <meta property="og:description" content="{{ page.meta.get('description', config.site_description) }}" />
  <meta property="og:site_name" content="Spector Documentation" />
  <meta property="og:image" content="{{ config.site_url }}assets/spector-og-card.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.meta.get('title', page.title) }} — Spector" />
  <meta name="twitter:description" content="{{ page.meta.get('description', config.site_description) }}" />
  <meta name="twitter:image" content="{{ config.site_url }}assets/spector-og-card.png" />

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.canonical_url }}" />

  <!-- JSON-LD Structured Data (SoftwareApplication) — homepage only -->
  {% if page.is_homepage %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Spector",
    "description": "The Zero-Overhead, Agent-Ready AI Memory Backbone. SIMD-accelerated vector search, cognitive memory for AI agents, built-in MCP server.",
    "url": "{{ config.site_url }}",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Cross-platform (JVM)",
    "programmingLanguage": "Java",
    "softwareVersion": "1.0",
    "license": "https://www.apache.org/licenses/LICENSE-2.0",
    "codeRepository": "https://github.com/spectrayan/spector",
    "author": {
      "@type": "Organization",
      "name": "Spectrayan",
      "url": "https://www.spectrayan.com/"
    },
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
  {% endif %}

  <!-- JSON-LD: TechArticle for content pages with descriptions -->
  {% if page.meta.get('description') and not page.is_homepage %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": "{{ page.meta.get('title', page.title) }}",
    "description": "{{ page.meta.get('description', '') }}",
    "url": "{{ page.canonical_url }}",
    "author": {
      "@type": "Organization",
      "name": "Spectrayan"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Spectrayan",
      "url": "https://www.spectrayan.com/"
    }
  }
  </script>
  {% endif %}

  {% endif %}
{% endblock %}
