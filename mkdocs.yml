site_name: Spector Documentation
site_description: "Spector — cognitive memory engine for AI agents. Four-tier store, association-graph recall, sub-millisecond scoring, no external database."
site_url: https://spectrayan.github.io/spector/
repo_url: https://github.com/spectrayan/spector
repo_name: spectrayan/spector
copyright: "Copyright &copy; 2026 Spectrayan — Apache License 2.0"

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/lightning-bolt
  logo: assets/spector-logo-icon.png
  favicon: assets/spector-favicon.png
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    # Navigation
    - navigation.tabs              # Top-level tabs
    - navigation.tabs.sticky       # Tabs stay visible on scroll
    - navigation.sections          # Bold section headers in sidebar
    - navigation.expand            # Auto-expand sidebar sections
    - navigation.top               # "Back to top" button on scroll
    - navigation.instant           # Single-page app feel (no full reload)
    - navigation.instant.progress  # Loading progress bar
    - navigation.instant.prefetch  # Pre-load pages on link hover for instant transitions
    - navigation.tracking          # URL updates as you scroll sections
    - navigation.indexes           # Section index pages
    - navigation.footer            # Previous/Next page links at bottom
    - navigation.path              # Breadcrumbs above page title
    - navigation.prune             # Prune non-active navigation trees for rendering performance
    # Header
    - header.autohide              # Hide header on scroll down, show on scroll up
    # Search
    - search.suggest               # Autocomplete suggestions
    - search.highlight             # Highlight search terms on page
    - search.share                 # Shareable search links
    # Content
    - content.code.copy            # Copy button on code blocks
    - content.code.select          # Select code block button
    - content.code.annotate        # Inline code annotations
    - content.tabs.link            # Linked content tabs across page
    - content.tooltips             # Rich tooltips on hover
    # TOC
    - toc.follow                   # TOC follows scroll position

plugins:
  - search:
      separator: '[\s\-\.]+'        # Better tokenization for compound terms
      lang: en
  - callouts
  - tags                            # Tag-based content discovery
  - minify:                         # Minify HTML for faster page loads
      minify_html: true

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys              # Render keyboard shortcuts like ++ctrl+c++
  - pymdownx.mark              # ==highlighted text==
  - pymdownx.critic            # Track changes markup
  - pymdownx.caret             # ^^superscript^^
  - pymdownx.tilde             # ~~strikethrough~~ and ~subscript~
  - pymdownx.smartsymbols      # (c) → ©, (tm) → ™, etc.
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list                   # Definition lists
  - footnotes                  # Footnote references
  - abbr                       # Abbreviation tooltips
  - tables
  - meta                       # Read front matter for meta tags
  - toc:
      permalink: true
      toc_depth: 3

