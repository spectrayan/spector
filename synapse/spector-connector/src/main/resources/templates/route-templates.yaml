    parameters:
      - name: tenantId
      - name: routeId
      - name: query
      - name: jdbcUrl
        defaultValue: ""
      - name: pollIntervalMs
        defaultValue: "600000"
      - name: collection
        defaultValue: "default"
    from:
      uri: "timer:{{routeId}}?period={{pollIntervalMs}}"
      steps:
        - setBody:
            constant: "{{query}}"
        - to:
            uri: "jdbc:dataSource"
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "db-{{routeId}}-${date:now:yyyyMMddHHmmss}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "DB query for route {{routeId}} completed"

- routeTemplate:
    id: "slack-notify"
    parameters:
      - name: tenantId
      - name: routeId
      - name: channel
      - name: webhookUrl
        defaultValue: ""
    from:
      uri: "direct:{{routeId}}"
      steps:
        - setHeader:
            name: CamelSlackChannel
            constant: "{{channel}}"
        - to:
            uri: "slack:#{{channel}}?webhookUrl={{webhookUrl}}"
        - log:
            message: "Slack message sent to {{channel}} for route {{routeId}}"

- routeTemplate:
    id: "email-notify"
    parameters:
      - name: tenantId
      - name: routeId
      - name: to
      - name: subject
        defaultValue: "Spector Notification"
      - name: smtpHost
      - name: smtpPort
        defaultValue: "587"
    from:
      uri: "direct:{{routeId}}"
      steps:
        - setHeader:
            name: To
            constant: "{{to}}"
        - setHeader:
            name: Subject
            constant: "{{subject}}"
        - to:
            uri: "smtp://{{smtpHost}}:{{smtpPort}}"
        - log:
            message: "Email sent to {{to}} for route {{routeId}}"

- routeTemplate:
    id: "kafka-consumer"
    parameters:
      - name: tenantId
      - name: routeId
      - name: topic
      - name: brokers
        defaultValue: "localhost:9092"
      - name: groupId
        defaultValue: "spector-ingest"
      - name: collection
        defaultValue: "default"
    from:
      uri: "kafka:{{topic}}?brokers={{brokers}}&groupId={{groupId}}"
      steps:
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "kafka-${header.kafka.OFFSET}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "Kafka message ingested from {{topic}} for route {{routeId}}"

