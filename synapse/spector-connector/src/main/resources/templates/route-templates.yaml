# ──────────────────────────────────────────────────────
# Camel Route Templates — YAML DSL
# ──────────────────────────────────────────────────────
# These are Camel route-template definitions loaded by
# the engine at startup via RoutesLoader.
#
# Each routeTemplate defines parameterized routes that
# get instantiated at runtime with user-provided config.
# ──────────────────────────────────────────────────────

- routeTemplate:
    id: "file-watch"
    parameters:
      - name: tenantId
      - name: routeId
      - name: path
        defaultValue: "/tmp/spector-watch"
      - name: pattern
        defaultValue: ".*\\.(txt|md|pdf|docx)"
      - name: recursive
        defaultValue: "true"
      - name: collection
        defaultValue: "default"
    from:
      uri: "file:{{path}}?include={{pattern}}&noop=true&recursive={{recursive}}"
      steps:
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "${header.CamelFileName}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "Ingested file ${header.CamelFileName} from route {{routeId}}"

- routeTemplate:
    id: "s3-poll"
    parameters:
      - name: tenantId
      - name: routeId
      - name: bucketName
      - name: region
        defaultValue: "us-east-1"
      - name: prefix
        defaultValue: ""
      - name: pollIntervalMs
        defaultValue: "300000"
      - name: deleteAfterRead
        defaultValue: "false"
      - name: collection
        defaultValue: "default"
    from:
      uri: "aws2-s3://{{bucketName}}?region={{region}}&prefix={{prefix}}&deleteAfterRead={{deleteAfterRead}}&delay={{pollIntervalMs}}"
      steps:
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "${header.CamelAwsS3Key}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "Ingested S3 object ${header.CamelAwsS3Key} from route {{routeId}}"

- routeTemplate:
    id: "rest-api-poll"
    parameters:
      - name: tenantId
      - name: routeId
      - name: url
      - name: method
        defaultValue: "GET"
      - name: authHeader
        defaultValue: ""
      - name: pollIntervalMs
        defaultValue: "300000"
      - name: collection
        defaultValue: "default"
    from:
      uri: "timer:{{routeId}}?period={{pollIntervalMs}}"
      steps:
        - setHeader:
            name: CamelHttpMethod
            constant: "{{method}}"
        - setHeader:
            name: Authorization
            constant: "{{authHeader}}"
        - to:
            uri: "{{url}}"
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "{{routeId}}-${date:now:yyyyMMddHHmmss}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "REST poll completed for route {{routeId}}"

