- routeTemplate:
    id: "web-scraper"
    parameters:
      - name: tenantId
      - name: routeId
      - name: startUrl
      - name: pollIntervalMs
        defaultValue: "86400000"
      - name: collection
        defaultValue: "default"
    from:
      uri: "timer:{{routeId}}?period={{pollIntervalMs}}"
      steps:
        - setHeader:
            name: spector-trace-id
            simple: "${exchangeId}"
        - to:
            uri: "{{startUrl}}"
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "web-${date:now:yyyyMMddHHmmss}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "Scraped and ingested URL for route {{routeId}}"
