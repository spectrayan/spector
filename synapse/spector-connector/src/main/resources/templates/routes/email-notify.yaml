- routeTemplate:
    id: "email-notify"
    parameters:
      - name: tenantId
      - name: routeId
      - name: to
      - name: subject
        defaultValue: "Spector Notification"
      - name: smtpHost
      - name: smtpPort
        defaultValue: "587"
    from:
      uri: "direct:{{routeId}}"
      steps:
        - setHeader:
            name: spector-trace-id
            simple: "${exchangeId}"
        - setHeader:
            name: To
            constant: "{{to}}"
        - setHeader:
            name: Subject
            constant: "{{subject}}"
        - to:
            uri: "smtp://{{smtpHost}}:{{smtpPort}}"
        - log:
            message: "Email sent to {{to}} for route {{routeId}}"
