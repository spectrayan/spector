- routeTemplate:
    id: "rss"
    parameters:
      - name: tenantId
      - name: routeId
      - name: feedUrl
      - name: pollIntervalMs
        defaultValue: "3600000"
      - name: splitEntries
        defaultValue: "true"
      - name: collection
        defaultValue: "default"
    from:
      uri: "rss:{{feedUrl}}?delay={{pollIntervalMs}}&splitEntries={{splitEntries}}"
      steps:
        - setHeader:
            name: spector-trace-id
            simple: "${exchangeId}"
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "rss-${date:now:yyyyMMddHHmmssSSS}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "Ingested RSS feed entry for route {{routeId}}"
