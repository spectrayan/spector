- routeTemplate:
    id: "channel-whatsapp"
    parameters:
      - name: tenantId
      - name: routeId
      - name: apiToken
        defaultValue: ""
      - name: phoneNumberId
        defaultValue: ""
      - name: recipientPhone
        defaultValue: ""
    from:
      uri: "direct:{{routeId}}"
      steps:
        - setHeader:
            name: spector-trace-id
            simple: "${exchangeId}"
        - setHeader:
            name: Authorization
            simple: "Bearer {{apiToken}}"
        - setHeader:
            name: Content-Type
            constant: "application/json"
        - to:
            uri: "https://graph.facebook.com/v18.0/{{phoneNumberId}}/messages"
        - log:
            message: "WhatsApp message dispatched for route {{routeId}}"
