- routeTemplate:
    id: "db-query"
    parameters:
      - name: tenantId
      - name: routeId
      - name: query
      - name: jdbcUrl
        defaultValue: ""
      - name: pollIntervalMs
        defaultValue: "600000"
      - name: collection
        defaultValue: "default"
    from:
      uri: "timer:{{routeId}}?period={{pollIntervalMs}}"
      steps:
        - setHeader:
            name: spector-trace-id
            simple: "${exchangeId}"
        - setBody:
            constant: "{{query}}"
        - to:
            uri: "jdbc:dataSource"
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "db-{{routeId}}-${date:now:yyyyMMddHHmmss}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "DB query for route {{routeId}} completed"
