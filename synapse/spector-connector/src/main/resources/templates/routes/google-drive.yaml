- routeTemplate:
    id: "google-drive"
    parameters:
      - name: tenantId
      - name: routeId
      - name: folderId
      - name: driveApiUrl
        defaultValue: "https://www.googleapis.com/drive/v3"
      - name: pollIntervalMs
        defaultValue: "3600000"
      - name: collection
        defaultValue: "default"
    from:
      uri: "timer:{{routeId}}?period={{pollIntervalMs}}"
      steps:
        - setHeader:
            name: spector-trace-id
            simple: "${exchangeId}"
        - to:
            uri: "{{driveApiUrl}}/files?q=%27{{folderId}}%27+in+parents"
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "gdrive-${date:now:yyyyMMddHHmmss}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "Google Drive poll completed for route {{routeId}}"
