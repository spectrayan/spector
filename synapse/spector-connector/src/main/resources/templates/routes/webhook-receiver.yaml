- routeTemplate:
    id: "webhook-receiver"
    parameters:
      - name: tenantId
      - name: routeId
      - name: webhookPath
      - name: host
        defaultValue: "0.0.0.0"
      - name: port
        defaultValue: "8765"
      - name: collection
        defaultValue: "default"
      - name: throttleRequests
        defaultValue: "100"
      - name: throttlePeriodMs
        defaultValue: "60000"
    from:
      uri: "netty-http:http://{{host}}:{{port}}{{webhookPath}}"
      steps:
        - throttle:
            expression:
              simple: "{{throttleRequests}}"
            timePeriodMillis: "{{throttlePeriodMs}}"
            asyncDelayed: true
        - setHeader:
            name: spector-trace-id
            simple: "${exchangeId}"
        - setHeader:
            name: spector-route-id
            constant: "{{routeId}}"
        - setHeader:
            name: spector-tenant-id
            constant: "{{tenantId}}"
        - setHeader:
            name: spector-collection
            constant: "{{collection}}"
        - setHeader:
            name: spector-doc-id
            simple: "webhook-${date:now:yyyyMMddHHmmssSSS}"
        - convertBodyTo:
            type: "java.lang.String"
        - process:
            ref: "spectorIngestionSink"
        - log:
            message: "Webhook received on {{webhookPath}} for route {{routeId}}"
