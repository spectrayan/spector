templates:
  - templateId: confluence
    displayName: "Atlassian Confluence"
    description: "Ingest spaces, pages, and blog posts from Atlassian Confluence."
    icon: "confluence"
    category: "Enterprise"
    connectorType: "CONFLUENCE"
    requiresCredential: true
    parameters:
      - name: host
        displayName: "Confluence Host"
        type: "string"
        required: true
        placeholder: "your-domain.atlassian.net"
      - name: spaceKey
        displayName: "Space Key"
        type: "string"
        required: true
        placeholder: "ENG"
      - name: apiToken
        displayName: "API Token / Password"
        type: "secret"
        required: true
      - name: username
        displayName: "Username / Email"
        type: "string"
        required: true
      - name: pollIntervalMs
        displayName: "Poll Interval (ms)"
        type: "number"
        required: false
        defaultValue: "3600000"
      - name: collection
        displayName: "Target Collection"
        type: "string"
        required: false
        defaultValue: "default"
