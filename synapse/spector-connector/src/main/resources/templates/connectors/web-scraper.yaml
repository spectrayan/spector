templates:
  - templateId: web-scraper
    displayName: "Web Scraper"
    description: "Crawl web pages, extract content as markdown, and ingest into memory."
    icon: "globe"
    category: "Data"
    connectorType: "WEB_SCRAPER"
    requiresCredential: false
    parameters:
      - name: startUrl
        displayName: "Start URL"
        type: "url"
        required: true
        placeholder: "https://docs.example.com"
      - name: maxDepth
        displayName: "Max Depth"
        type: "number"
        required: false
        defaultValue: "3"
      - name: pollIntervalMs
        displayName: "Poll Interval (ms)"
        type: "number"
        required: false
        defaultValue: "86400000"
      - name: collection
        displayName: "Target Collection"
        type: "string"
        required: false
        defaultValue: "default"
