# ═══════════════════════════════════════════════════════════════════
# Spector — Docker Compose
# ═══════════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose up -d                        # Core Spector engine + REST + SSE + MCP
#   docker compose --profile embeddings up -d   # With local Ollama embedding container
#   docker compose --profile gpu up -d          # With GPU-accelerated Ollama
#   docker compose logs -f spector              # Follow logs
#   docker compose down                         # Stop containers
#   docker compose down -v                      # Stop and remove persistent data volumes
#
# Endpoints:
#   Dashboard:    http://localhost:7700
#   Health:       http://localhost:7700/health
#   Metrics:      http://localhost:7700/metrics
#   Engine API:   http://localhost:7700/api/v1/engine/status
#   Memory API:   http://localhost:7700/api/v1/memory/status
#   Events SSE:   http://localhost:7700/api/v1/events
#   MCP (HTTP):   http://localhost:7700/mcp
#   Direct API:   http://localhost:7070/api/v1/engine/status
# ═══════════════════════════════════════════════════════════════════

name: spector

services:
  spector:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: ghcr.io/spectrayan/spector:latest
    container_name: spector
    ports:
      - "7700:8080"
      - "7070:7070"
    environment:
      - SPECTOR_PORT=7070
      - SPECTOR_NODE_ID=spector-docker
      - SPECTOR_DIMS=384
      - SPECTOR_DATA_DIR=/data
    volumes:
      - spector-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7070/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: spector-ollama
    profiles: ["embeddings"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: spector-ollama-gpu
    profiles: ["gpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  spector-data:
  ollama-data:
