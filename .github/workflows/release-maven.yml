name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run — package, javadoc, sources, and sign only (do not publish)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Override version (e.g. 0.1.0-beta.1). Leave empty to use tag or pom.xml revision'
        required: false
        default: ''
        type: string
      modules:
        description: 'Maven modules to deploy (default: :spector,sdks/java/spector-client)'
        required: false
        default: ':spector,sdks/java/spector-client'
        type: string
      channel:
        description: 'Release channel (release, rc, milestone)'
        required: false
        default: 'rc'
        type: choice
        options:
          - release
          - rc
          - milestone

permissions:
  contents: read

jobs:
  release-maven:
    name: Publish Artifacts to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY || secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Generate Maven settings for Sonatype Central Portal
        env:
          CENTRAL_USER: ${{ secrets.MAVEN_SERVER_USERNAME || secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_SERVER_PASSWORD || secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USER}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish to Maven Central
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.GPG_PASSPHRASE }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.GPG_PASSPHRASE }}
        run: |
          GOAL="deploy"
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            GOAL="verify"
          fi
          CHANNEL="${{ github.event.inputs.channel || 'rc' }}"
          MODULES="${{ github.event.inputs.modules || ':spector,sdks/java/spector-client' }}"

          DEPLOY_VERSION="${{ github.event.inputs.version }}"
          if [ -z "$DEPLOY_VERSION" ] && [[ "$GITHUB_REF_NAME" =~ ^v?[0-9] ]]; then
            DEPLOY_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$DEPLOY_VERSION" ]; then
            DEPLOY_VERSION=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | head -n 1)
          fi

          echo "Target deployment version: ${DEPLOY_VERSION}"

          # Maven Central Portal is immutable; check if artifact already exists to avoid fatal 400 rejection
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/com/spectrayan/spector/${DEPLOY_VERSION}/spector-${DEPLOY_VERSION}.pom" || true)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "::warning::Version ${DEPLOY_VERSION} is already published on Maven Central. Skipping deployment."
            exit 0
          fi

          mvn -B $GOAL -P $CHANNEL -DskipTests \
            -Drevision="${DEPLOY_VERSION}" \
            -pl "$MODULES" \
            --no-transfer-progress
