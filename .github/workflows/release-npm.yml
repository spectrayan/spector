name: Release NPM Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run — build and package only (do not publish to registry)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Override version (e.g. 0.1.0-beta.0). Leave empty to use tag or package.json'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  publish-npm:
    name: Build & Publish Packages to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 1. Publish TypeScript Client SDK (@spectrayan/spector-client)
      - name: Build and Publish @spectrayan/spector-client
        working-directory: sdks/typescript/spector-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dryRun }}" != "true" ] && [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Error: NPM_TOKEN secret is not configured." >&2
            exit 1
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version
          elif [[ "$GITHUB_REF_NAME" =~ ^v?[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          npm ci
          npm run build
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          npm publish --access public $EXTRA_FLAGS

      # 2. Publish Zero-Install MCP Runner (@spectrayan/spector)
      - name: Publish @spectrayan/spector (NPX Runner)
        working-directory: deploy/npm/spector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dryRun }}" != "true" ] && [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Error: NPM_TOKEN secret is not configured." >&2
            exit 1
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version
          elif [[ "$GITHUB_REF_NAME" =~ ^v?[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          npm publish --access public $EXTRA_FLAGS
