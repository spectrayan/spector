name: License Header Auto-Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '**.java'
      - '**.ts'
      - '**.js'
      - '**.py'

# Cancel in-progress runs for the same PR
concurrency:
  group: license-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-license-headers:
    # Do not run auto-fix on forked PRs — external contributions cannot be pushed to via GITHUB_TOKEN
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Fix License Headers
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check license headers
        id: license-check
        continue-on-error: true
        run: |
          if mvn -B license:check --no-transfer-progress 2>&1 | tee license-output.txt; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: Format license headers
        if: steps.license-check.outputs.status == 'fail'
        continue-on-error: true
        run: |
          mvn -B license:format --no-transfer-progress || true

      - name: Check for changes
        if: steps.license-check.outputs.status == 'fail'
        id: changes
        continue-on-error: true
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "### Files updated with license headers:" >> $GITHUB_STEP_SUMMARY
            git diff --name-only >> $GITHUB_STEP_SUMMARY
          fi

      # ─── Same-repo PRs: auto-commit the fix ──────────────────────
      - name: Commit license fixes (same-repo PRs)
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          git config user.name "spectrayan-bot"
          git config user.email "bot@spectrayan.dev"
          git add -A
          git commit -m "chore(license): auto-fix license headers

          Applied by CI — see CONTRIBUTING.md#license-headers" || echo "Nothing to commit"
          git push || echo "::warning::Failed to push auto-fix commit (branch may be protected or remote changed)"
