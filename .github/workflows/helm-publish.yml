name: Publish Helm Chart to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version override (e.g. 0.1.0-beta.0). Leave empty to use tag or Chart.yaml'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm Chart
        run: |
          helm lint deploy/helm/spector

      - name: Package Chart
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF_NAME" =~ ^v?[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          EXTRA_ARGS=""
          if [ -n "$VERSION" ]; then
            EXTRA_ARGS="--version $VERSION --app-version $VERSION"
          fi

          mkdir -p .cr-release-packages
          helm package deploy/helm/spector $EXTRA_ARGS --destination .cr-release-packages

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Chart to OCI Registry
        run: |
          for pkg in .cr-release-packages/*.tgz; do
            helm push "$pkg" oci://ghcr.io/spectrayan/charts
          done
