name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release spector.jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build spector.jar
        run: |
          # Build fat JAR with all synapse dependencies
          mvn -B clean package -DskipTests -pl synapse/spector-cli -am --no-transfer-progress
          cp synapse/spector-cli/target/spector.jar ./spector.jar
          sha256sum spector.jar > spector.jar.sha256
          echo "Generated spector.jar checksum:"
          cat spector.jar.sha256

      - name: Smoke Test spector.jar
        run: |
          java --enable-preview --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -jar spector.jar --help
          java --enable-preview --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -jar spector.jar doctor --json

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets..."
            gh release upload "$TAG" spector.jar spector.jar.sha256 --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" spector.jar spector.jar.sha256 \
              --title "Spector $TAG" \
              --generate-notes
          fi

