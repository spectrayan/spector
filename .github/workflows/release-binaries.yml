name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-beta.0). Required when running manually'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release spector.jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build spector.jar
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_ARG=""
          if [ -n "$TAG" ] && [ "$TAG" != "main" ]; then
            VERSION_ARG="-Drevision=${TAG#v}"
          fi
          # Build fat JAR with all synapse dependencies
          mvn -B clean package -DskipTests $VERSION_ARG -pl synapse/spector-cli -am --no-transfer-progress
          cp synapse/spector-cli/target/spector.jar ./spector.jar
          sha256sum spector.jar > spector.jar.sha256
          echo "Generated spector.jar checksum:"
          cat spector.jar.sha256

      - name: Smoke Test spector.jar
        run: |
          java --enable-preview --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -jar spector.jar --help
          java --enable-preview --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -jar spector.jar doctor --json

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            echo "Error: Must specify a valid release tag (e.g. v0.1.0-beta.0) when running manually." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets..."
            gh release upload "$TAG" spector.jar spector.jar.sha256 --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" spector.jar spector.jar.sha256 \
              --title "Spector $TAG" \
              --generate-notes
          fi

