<div class="mel-studio-page">
  <!-- Top Banner Header -->
  <header class="mel-studio-header cortex-glass">
    <div class="header-brand-wrap">
      <div class="brand-badge-box">
        <mat-icon class="brand-icon">terminal</mat-icon>
      </div>
      <div class="brand-titles">
        <div class="brand-row">
          <h1 class="page-title">MEL Studio & 6-Phase Recall Workbench</h1>
          <span class="spec-badge cortex-mono">MEL-001 SPEC</span>
        </div>
        <p class="page-subtitle">
          Execute interactive Memory Engine Language statements, test 6-phase cascading filter funnels, and audit cognitive scoring
        </p>
      </div>
    </div>

    <div class="header-actions">
      <button
        type="button"
        class="action-btn-outline"
        (click)="onQuickExplain()"
        matTooltip="Quick-run EXPLAIN RECALL on current cue"
      >
        <mat-icon>auto_awesome</mat-icon>
        <span>EXPLAIN RECALL</span>
      </button>

      <button
        type="button"
        class="action-btn-primary"
        [disabled]="isRunning()"
        (click)="onRunScript()"
        matTooltip="Execute current script (Cmd/Ctrl+Enter)"
      >
        <mat-icon>{{ isRunning() ? 'hourglass_top' : 'play_arrow' }}</mat-icon>
        <span>{{ isRunning() ? 'Running...' : 'Run Workbench' }}</span>
      </button>
    </div>
  </header>

  <!-- 12-Column Workbench Grid -->
  <div class="mel-workbench-grid">
    <!-- Left Explorer Rail (3 cols) -->
    <div class="mel-left-column">
      <cortex-mel-explorer-rail
        [namespace]="activeNamespace()"
        [history]="melHistory()"
        [workingCount]="state.workingMemoryCount()"
        [episodicCount]="state.episodicMemoryCount()"
        [semanticCount]="state.semanticMemoryCount()"
        [proceduralCount]="state.proceduralMemoryCount()"
        (selectSnippet)="onSelectSnippet($event)"
        (projectTier)="onProjectTier($event)"
        (selectHistory)="onSelectHistory($event)"
      />
    </div>

    <!-- Right Workbench (9 cols) -->
    <div class="mel-right-column">
      <!-- Bidirectional Visual Assist Bar -->
      <cortex-mel-visual-assist
        [state]="assistState()"
        [isOpen]="isAssistOpen()"
        (toggleOpen)="isAssistOpen.set(!isAssistOpen())"
        (stateChange)="onAssistStateChange($event)"
      />

      <!-- MEL Code Editor -->
      <cortex-mel-editor
        [script]="script()"
        [diagnostics]="diagnostics()"
        [isRunning]="isRunning()"
        (scriptChange)="onScriptChange($event)"
        (execute)="onRunScript()"
        (validate)="onValidate()"
      />

      <!-- 4-Tab Results & Diagnostics Dock -->
      <cortex-mel-results-dock
        [activeTab]="activeTab()"
        [candidates]="candidates()"
        [melResponse]="melResponse()"
        (tabChange)="activeTab.set($event)"
        (diagnose)="onDiagnose($event)"
        (reinforce)="onReinforce($event)"
      />
    </div>
  </div>

  <!-- Slide-Up Counterfactual Why-Not Drawer -->
  @if (diagnosticMemoryId(); as diagId) {
    <cortex-why-not-drawer
      [memoryId]="diagId"
      [queryCue]="assistState().cue"
      (close)="diagnosticMemoryId.set(null)"
      (applySuggestion)="onApplySuggestion($event)"
    />
  }
</div>
