<div class="settings-page">

  <!-- ── Page Header ── -->
  <div class="settings-header">
    <div class="header-left">
      <mat-icon class="header-icon">tune</mat-icon>
      <h2 class="header-title">Settings</h2>
    </div>
    <div class="header-actions">
      <button mat-stroked-button (click)="state.resetProfile()" matTooltip="Reset all to defaults">
        <mat-icon>restart_alt</mat-icon>
        Reset
      </button>
      <button mat-flat-button color="primary" (click)="state.saveProfile()" [disabled]="state.saving()">
        <mat-icon>save</mat-icon>
        {{ state.saving() ? 'Saving...' : 'Save Profile' }}
      </button>
    </div>
  </div>

  @if (state.loading()) {
    <mat-progress-bar mode="indeterminate" class="settings-loader"></mat-progress-bar>
  }

  <!-- ── Tab Group ── -->
  <mat-tab-group animationDuration="200ms" class="settings-tabs">

    <!-- ═══ Tab 1: My Profile ═══ -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">person</mat-icon>
        <span>My Profile</span>
      </ng-template>
      <cortex-profile-settings />
    </mat-tab>

    <!-- ═══ Tab 2: Personality ═══ -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">psychology</mat-icon>
        <span>Personality</span>
      </ng-template>
      <cortex-personality-settings />
    </mat-tab>

    <!-- ═══ Tab 3: Values & Culture ═══ -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">public</mat-icon>
        <span>Values &amp; Culture</span>
      </ng-template>
      <cortex-values-settings />
    </mat-tab>

    <!-- ═══ Tab 4: Scoring ═══ -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">science</mat-icon>
        <span>Scoring</span>
      </ng-template>
      <cortex-scoring-settings />
    </mat-tab>

    <!-- ═══ Tab 5: AI Configuration ═══ -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">psychology</mat-icon>
        <span>AI Configuration</span>
      </ng-template>
      <cortex-ai-config-settings />
    </mat-tab>

    <!-- ═══ Tab 6: Privacy & Security ═══ -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">shield</mat-icon>
        <span>Privacy &amp; Security</span>
      </ng-template>
      <cortex-privacy-settings />
    </mat-tab>

    <!-- ═══ Tab 7: API Keys ═══ -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">key</mat-icon>
        <span>API Keys</span>
      </ng-template>
      <cortex-api-keys-settings />
    </mat-tab>

  </mat-tab-group>

</div>
