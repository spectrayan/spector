# ═══════════════════════════════════════════════════════════════════════
# Spector — Default Configuration
# ═══════════════════════════════════════════════════════════════════════
#
# This file is bundled inside the JAR and provides sensible defaults.
# Override any value by placing a 'spector.yml' in the working directory,
# using a profile file (spector-{profile}.yml), system properties
# (-Dspector.memory.dimensions=768), or environment variables
# (SPECTOR_MEMORY_DIMENSIONS=768).
#
# Resolution order (highest priority wins):
#   1. Programmatic overrides
#   2. System properties
#   3. Environment variables
#   4. spector-{profile}.yml
#   5. spector.yml (working directory)
#   6. spector-defaults.yml (this file, classpath)
# ═══════════════════════════════════════════════════════════════════════

spector:

  # ─── Global Mode (MEMORY) ───
  mode: MEMORY

  # ─── HNSW Index Parameters ───
  hnsw:
    m: 16
    ef-construction: 200
    ef-search: 50

  # ─── IVF/PQ Parameters ───
  ivf:
    nlist: 0
    nprobe: 0
    pq-subspaces: 0

  # ─── SPECTRUM Adaptive Index ───
  spectrum:
    n-centroids: 256
    n-probe: 16
    shard-threshold: 20000
    oversampling-factor: 3
    kmeans-iterations: 25

  # ─── Multi-LLM Provider Defaults ───
  provider:
    embedding:
      type: ollama
      model: nomic-embed-text
      base-url: http://localhost:11434
      api-key: ""
      dimensions: 768
      timeout: 30s
      batch-size: 32
      max-retries: 3
      max-concurrent: 0
      cache:
        enabled: true
        max-size: 1000
        ttl: 60m
        stats-log-interval: 5m
    generation:
      type: ollama
      model: ""
      base-url: http://localhost:11434
      api-key: ""

  # ─── Persistence File Names ───
  persistence:
    files:
      index: index.spct
      vectors: vectors.mmap
      documents: documents.dat
      id-mappings: id-mappings.dat

  # ─── Cognitive Memory Module ───
  memory:
    enabled: true
    persistence-mode: DISK
    persistence-path: .spector/memory
    dimensions: 384
    capacity: 100000
    nodes-per-partition: 10000
    decay-enabled: true
    consolidation-interval: 60s
    default-ingestion-tier: SEMANTIC
    hnsw-prefilter: auto
    tag-extractor: content
    tag-extractor-model: ""
    text-search-mode: HYBRID
    splade-enabled: true
    colbert-enabled: true
    bm25-enabled: true

  # ─── File Ingestion ───
  ingestion:
    root-directory: .
    file-pattern: "**/*.md"
    skip-dirs: ".git,.idea,.mvn,target,node_modules,.github"
    chunk-size: 2500
    chunk-overlap: 200
