# ═══════════════════════════════════════════════════════════════════════
# Spector — Default Configuration
# ═══════════════════════════════════════════════════════════════════════

spector:
  mode: MEMORY

  hnsw:
    m: 16
    ef-construction: 200
    ef-search: 50

  ivf:
    nlist: 0
    nprobe: 0
    pq-subspaces: 0

  spectrum:
    n-centroids: 256
    n-probe: 16
    shard-threshold: 20000
    oversampling-factor: 3
    kmeans-iterations: 25

  provider:
    embedding:
      type: ollama
      model: nomic-embed-text
      base-url: http://localhost:11434
      api-key: ""
      dimensions: 768
      timeout: 30s
      batch-size: 32
      max-retries: 3
      max-concurrent: 0
      cache:
        enabled: true
        max-size: 1000
        ttl: 60m
        stats-log-interval: 5m
    generation:
      type: ollama
      model: ""
      base-url: http://localhost:11434
      api-key: ""

  persistence:
    files:
      index: index.spct
      vectors: vectors.mmap
      documents: documents.dat
      id-mappings: id-mappings.dat

  memory:
    enabled: true
    persistence-mode: DISK
    persistence-path: .spector/memory
    dimensions: 384
    capacity: 100000
    nodes-per-partition: 10000
    decay-enabled: true
    consolidation-interval: 60s
    default-ingestion-tier: SEMANTIC
    hnsw-prefilter: auto
    tag-extractor: content
    tag-extractor-model: ""
    text-search-mode: HYBRID
    splade-enabled: true
    colbert-enabled: true
    bm25-enabled: true

  ingestion:
    root-directory: .
    file-pattern: "**/*.md"
    skip-dirs: ".git,.idea,.mvn,target,node_modules,.github"
    chunk-size: 2500
    chunk-overlap: 200
